      - generic [ref=e218]:
        - heading "FAQ" [level=2] [ref=e220]
        - generic [ref=e222]:
          - generic [ref=e223]:
            - button "What is GoGloby?" [ref=e224] [cursor=pointer]
            - paragraph [ref=e229]: "GoGloby is an engineering-led staffing and recruiting agency specializing in Data and AI Engineers. Since 2021, we have built dozens of Data and AI engineering teams for VC-backed startups and global enterprises. We do it two ways: we recruit full-time engineers for onsite US roles, and we embed nearshore engineers in existing teams. Every candidate is vetted by engineers and backed by a 120-day guarantee."
          - generic [ref=e230]:
            - button "What services does GoGloby offer?" [ref=e231] [cursor=pointer]
            - paragraph [ref=e236]: "GoGloby offers two services for hiring Data and AI Engineers: 1) Recruiting: We find and close full-time Data and AI Engineers for onsite US roles. You pay only on hire, with a 120-day guarantee. We also run AI executive search for AI leaders; 2) Staffing: We embed nearshore Data and AI Engineers in your existing team, on US hours, for a flat monthly fee, with built-in telemetry on velocity and AI cost."
          - generic [ref=e237]:
            - button "Who does GoGloby work with?" [ref=e238] [cursor=pointer]
            - paragraph [ref=e243]: "GoGloby works with VC-backed startups and global enterprises. Companies typically engage GoGloby at one of five points: the first AI hire, an AI search that will not close, no way to test real AI skills, a headcount freeze, or no view after the hire."
          - generic [ref=e244]:
            - button "Where is GoGloby based, and since when?" [ref=e245] [cursor=pointer]
            - paragraph [ref=e250]: GoGloby was founded in 2021 and is headquartered in Dover, Delaware.
          - generic [ref=e251]:
            - button "How is GoGloby different from other AI staffing and recruiting agencies?" [ref=e252] [cursor=pointer]
            - paragraph [ref=e257]: As an engineering-led agency, GoGloby differs in three ways. Every candidate is vetted by engineers, not recruiters, in a 4-stage assessment that only 4% pass. Every engineer we embed comes with built-in telemetry on velocity and AI cost. And every engineer is backed by an unprecedented 120-day guarantee.
          - generic [ref=e258]:
            - button "What does" [ref=e259] [cursor=pointer]:
              - generic [ref=e260]: What does “engineering-led” mean?
            - paragraph [ref=e264]: "Engineering-led means the people who run GoGloby and judge every candidate are engineers, not recruiters. We have built and led engineering, ML and AI teams ourselves, so we assess candidates the way a hiring CTO would: on real code, not on a resume."
          - generic [ref=e265]:
            - button "How does GoGloby vet engineers, and who does the vetting?" [ref=e266] [cursor=pointer]
            - paragraph [ref=e271]: "Engineers do the vetting, not recruiters. Every candidate goes through a 4-stage technical assessment: they write a spec from a loose requirement, refactor a real 50,000-line codebase with AI coding tools, design a system under production constraints, and handle a live production incident. A culture-fit interview, reference checks and a background check follow. Only 4% pass."
          - generic [ref=e272]:
            - button "What guarantees does GoGloby offer?" [ref=e273] [cursor=pointer]
            - paragraph [ref=e278]: GoGloby backs every engineer with a 120-day guarantee. In recruiting, you pay only on hire, and if the hire does not work out within 120 days, we find a replacement at no cost. In staffing, built-in telemetry tracks results from the first sprint, and if their performance falls, we replace the engineer at no additional cost.
          - generic [ref=e279]:
            - button "How do I know how a GoGloby engineer performs after the hire?" [ref=e280] [cursor=pointer]
            - paragraph [ref=e285]: Every engineer GoGloby embed comes with proprietary built-in telemetry. Every sprint, you see each engineer’s velocity, their AI cost per shipped feature, and how much they actually use AI tools. It reads metadata only and never touches your source code. So you judge an engineer on what they ship, from the first sprint, not on a quarterly impression.
          - generic [ref=e286]:
            - button "Where are the engineers located?" [ref=e287] [cursor=pointer]
            - paragraph [ref=e292]: In two places. Engineers we recruit work onsite at your US offices as your full-time employees. Engineers we embed are nearshore, based in Latin America, and work US hours inside your team, so standups, code reviews and merges happen in your working day.
          - generic [ref=e293]:
            - button "Is GoGloby an outsourcing company or a freelance marketplace?" [ref=e294] [cursor=pointer]
            - paragraph [ref=e299]: "Neither. GoGloby is a staffing and recruiting agency. Unlike an outsourcing firm, we never take over your project: engineers we embed work inside your team, under your leads, and you own all the code. Unlike a freelance marketplace, every engineer is vetted by engineers and works full-time for one client only."
          - generic [ref=e300]:
            - button "Which staffing agencies specialize in Data and AI Engineers?" [ref=e301] [cursor=pointer]
            - paragraph [ref=e306]: GoGloby is an engineering-led staffing and recruiting agency specializing in Data and AI Engineers. Since 2021, we have helped VC-backed startups and global enterprises hire AI engineers onsite in the US or nearshore in LatAm.
          - generic [ref=e307]:
            - button "Which recruiting agencies are run by engineers, not recruiters?" [ref=e308] [cursor=pointer]
            - paragraph [ref=e313]: GoGloby is. We are run by engineers who have built and led engineering, ML and AI teams, and it is engineers, not recruiters, who vet every candidate in a 4-stage assessment that only 4% pass.
