        - generic [ref=e93]:
          - generic:
            - img "Background"
            - img "Background"
          - heading "About GoGloby" [level=2] [ref=e94]
          - generic [ref=e95]:
            - paragraph [ref=e96]: "We started GoGloby in 2021, long before AI hiring went mainstream. We had built engineering, ML and AI teams ourselves, and we kept seeing the same problem from the hiring side: agencies sent resumes in volume, recruiters could not tell a strong engineer from a well-written profile, and the cost of a wrong hire landed on the CTO."
            - paragraph [ref=e97]: So we built the agency we wanted to hire from. Engineers judge every candidate. Every search is run by a dedicated team that learns the client’s bar. And every hire is backed by a guarantee.
            - paragraph [ref=e98]: "Today GoGloby works with companies from VC-backed startups to Nasdaq-listed enterprises: FinTech, HealthTech, gaming, entertainment and enterprise software."
            - heading "When Companies Call GoGloby" [level=3] [ref=e99]
            - list [ref=e100]:
              - listitem [ref=e101]:
                - strong [ref=e102]: The first AI hire.
                - text: A new AI function needs its first leader or founding engineer, and a wrong hire sets the direction for everyone after.
              - listitem [ref=e103]:
                - strong [ref=e104]: The search that will not close.
                - text: A Data or AI role has been open for months, and the shortlists keep failing engineering’s interviews.
              - listitem [ref=e105]:
                - strong [ref=e106]: The roadmap that cannot wait.
                - text: The product needs senior engineers now, faster than US hiring allows.
              - listitem [ref=e107]:
                - strong [ref=e108]: No view after the hire.
                - text: The team is growing, but nobody can see what each engineer ships or what AI really costs.
            - heading "Two Ways to Build Your Team" [level=3] [ref=e109]
            - list [ref=e110]:
              - listitem [ref=e111]:
                - strong [ref=e112]: Recruiting.
                - text: We find, vet and place full-time Data and AI Engineers and AI leaders on your payroll, onsite or hybrid in the US. You pay only on hire, and every hire carries a 120-day replacement guarantee.
              - listitem [ref=e113]:
                - strong [ref=e114]: Staffing.
                - text: We embed senior Data and AI Engineers in your team. They are based in Latin America and work US hours, inside your sprints, under your leads. The AI Development Intelligence Layer shows each engineer’s velocity and AI cost per shipped feature, sprint by sprint.
            - heading "Why GoGloby Is Different from Other Agencies" [level=3] [ref=e115]
            - paragraph [ref=e116]:
              - strong [ref=e117]: Vetting by engineers.
              - text: Every candidate goes through a 4-stage technical assessment judged by engineers. They write a spec from a loose requirement, refactor a real 50,000-line codebase with AI coding tools, design a system under production constraints and handle a live production incident. A culture interview, reference checks and a background check follow. About 4% of candidates pass.
            - paragraph [ref=e118]:
              - strong [ref=e119]: Visibility after the hire.
              - text: Our AI Development Intelligence Layer integrates into your engineering process. Sprint by sprint, it shows each engineer’s velocity, the AI cost of every shipped feature and how much each engineer really uses AI tools. It reads metadata only and never touches your source code.
            - paragraph [ref=e120]:
              - strong [ref=e121]: A guarantee few agencies offer.
              - text: If a hire does not work out within 120 days, we find a replacement at no cost.
            - heading "Featured Clients:" [level=3] [ref=e122]
            - paragraph [ref=e123]: Hasbro ($4.1B revenue); Deel ($17.3B valuation); Keywords Studios (acquired for $2.8B); EverCommerce (740K+ SMB customers); DrChrono (17.8M+ patients, $4.9B revenue); Devsisters (300M+ users); MikeWorldWide (~$100M revenue); Zillow ($2.2B revenue); TATA ($165B+ group revenue); Canopy ($285M raised); Databento ($127M raised)
      - generic [ref=e126]:
        - heading "GoGloby Founders" [level=2] [ref=e129]
        - generic [ref=e131]:
