            - generic [ref=e135]:
              - heading "Sergey Matikaynen, Co-Founder" [level=3] [ref=e136]
              - paragraph [ref=e138]: "Sergey has spent 17 years building software systems, engineering organizations and production platforms, including at SAP. He has built and managed ML, AI and engineering teams for highly regulated sectors such as payments, finance and HealthTech. At GoGloby he leads the technology behind AI-native engineering: agent orchestration, SDLC automation, developer telemetry, security and engineering economics."
          - group "2 / 2" [ref=e139]:
            - generic [ref=e142]:
              - heading "Vitaly Koval, Co-Founder" [level=3] [ref=e143]
              - paragraph [ref=e145]: Vitaly shapes GoGloby’s vision and growth and leads sales and marketing. For about a decade he has helped engineering leaders scale teams across the US, Canada, Latin America and Europe. He is an entrepreneur, an industry speaker and a former LinkedIn Top Voice, and his work has been featured on CNN, Forbes, NBC and CBS.
